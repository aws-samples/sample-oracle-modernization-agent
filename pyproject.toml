[project]
name = "oma-sql-transform"
version = "0.1.0"
description = "Application SQL Transform Agent - AI-powered Oracle to PostgreSQL/MySQL SQL converter (part of OMA)"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
oma = "cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
